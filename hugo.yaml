# --- Basic Site Settings ---
baseURL: "https://jswindell.dev/"
languageCode: "en-us"
title: "John Swindell - Portfolio"
theme: hugo-profile

# Minify generated markup in every build, including Cloudflare Pages.
minify:
  minifyOutput: true

# --- Output Formats ---
outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

# --- Generate robots.txt ---
enableRobotsTXT: true

  # --- Optional Services ---
  #services:
  #googleAnalytics:
  #id: G-MEASUREMENT_ID
  #disqus:
  #shortname: your-disqus-shortname

# --- Pagination for Lists ---
pagination:
  pagerSize: 6

# --- Markdown Renderer ---
markup:
  goldmark:
    renderer:
      unsafe: true

# --- Main Navigation Menu ---
Menus:
  main:
  - identifier: blog
    name: Blogs & Case Studies
    title: Engineering Case Studies & Interesting Things
    url: /blogs
    weight: 1
#   - identifier: gallery
#     name: Gallery
#     title: Gallery
#     url: /gallery
#     weight: 2


