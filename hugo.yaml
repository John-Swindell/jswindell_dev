  about:
    enable: true
    title: "About Me"
    image: "/images/me.png" 
    content: |-
      I am an early-career engineer and founder focused on applied AI systems: document-to-context pipelines, LLM-ready workflows, data infrastructure, and automation that lets non-specialist users operate complex systems without living inside the implementation details.

      My current work spans Technical Lead work at Tekly Studio, where I own Crypt0nest.io product delivery and set engineering standards for a 44-person mixed BS/MS intern and contributor cohort, plus founder-led product ownership at Ellide, where I am building an educator-first AI study-material platform. The common thread is the same: build useful systems, make the workflow reliable, and keep AI output grounded in the source material or operational reality it came from.

      I am also deepening my Go and Kubernetes fundamentals while preparing for the Certified Kubernetes Administrator exam.
    skills:
      enable: true
      title: "Core Technologies:"
      items:
        - "AI Product Engineering"
        - "LLM Workflows"
        - "Python, Go, JavaScript, SQL, NoSQL"
        - "OpenAI & Gemini API Integration"
        - "Google Cloud Platform: Cloud Run, GCS"
        - "Terraform, Docker, GitHub Actions"
        - "MLOps / LLMOps / AI Tooling"
        - "Linux, Bash, Self-Hosting"
        - "Data Pipelines, Validation Gates, Caching"
        - "Technical Writing & Product Documentation"


  experience:
    enable: true
    title: "Professional Experience"
    items:
      - job: "Technical Lead (Contract)"
        company: "Tekly Studio"
        tabLabel: "Tekly Studio Lead"
        companyUrl: "https://tekly.dev/"
        date: "Dec 2025 - Present"
        content: |
          Hired by the CEO as Technical Lead to own technical delivery for Crypt0nest.io products and set engineering standards for a 44-person mixed BS/MS intern and contributor cohort, majority MS-level.
          - AI-Driven Onboarding Platform: Built a production-critical onboarding system on Google Cloud Run that connects Airtable, Google Workspace, DocuSign, email workflows, and Gemini-generated LMS curricula.
          - CI/CD and Engineering Governance: Architected GitHub Actions workflows, RBAC controls, review gates, and branching standards so contributors can ship through auditable delivery paths.
          - AI Enablement: Built internal OpenAI/Gemini tooling, including context-aware support workflows and documentation-grounded training content for new contributors.
          - Product Delivery: Own product execution for Crypt0nest.io workstreams while translating ambiguous founder/operator requirements into maintainable software and clear technical documentation.

      - job: "Founder"
        company: "Ellide"
        tabLabel: "Ellide Founder"
        companyUrl: "https://ellide.co/"
        date: "May 2026 - Present"
        content: |
          Founded Ellide, an AI study-material platform that turns syllabi, slides, scanned readings, and handouts into AI-ready teaching documents grounded in the actual course material.
          - Product Ownership: Designed the public educator workflow, student experience, developer positioning, and privacy-first product narrative for a closed-source AI document platform.
          - LLM-Ready Documents: Built the product around a practical problem in AI adoption: messy PDFs and raw uploads often produce generic answers, while structured Markdown, JSON, and teaching guidance give LLMs cleaner context.
          - Educator-First AI: Focused the product on guided learning, source references, Socratic tutoring behavior, and instructor-defined teaching posture instead of generic answer dumping.
          - Developer Surface: Published a developer-facing workflow at dev.ellide.co for OCR-heavy documents, structured Markdown/JSON output, and downstream use in AI chats, internal tools, and RAG pipelines.

      - job: "MLOps & Data Engineer Intern"
        company: "Crypt0nest.io"
        tabLabel: "Tekly Internship"
        companyUrl: "https://crypt0nest.io/"
        date: "Jun 2025 - Sep 2025"
        content: |
          Built data infrastructure and model-validation tooling for quantitative crypto research, with proprietary strategy details removed from the public case studies.
          - GCP Data Pipeline: Architected a Dockerized ETL pipeline that ingested CoinGecko, DeFi Llama, and LunarCrush data into GCS-backed datasets for model training.
          - Caching and Cost Control: Implemented a two-tier local/GCS cache that reduced repeated data refreshes from hours to minutes and cut external API dependency by roughly 90%.
          - Model Validation: Added SHAP diagnostics, walk-forward validation, and ingestion checks that blocked 6,000+ data integrity errors before downstream models consumed polluted records.
          - Point-in-Time Architecture: Designed pipeline logic to reduce survivorship and lookahead bias in historical training data.

      - job: "Server Administrator"
        company: "Repulsion Ltd."
        tabLabel: "Repulsion Ltd."
        companyUrl: "https://www.repulsion.co.uk/"
        date: "October 2021 - October 2023"
        content: |
          Supported 16 Linux-based, Pterodactyl-managed game server environments during U.S. off-hours.
          - Linux Operations: Used Bash and panel-based tooling to troubleshoot plugin failures, restarts, configuration issues, and player-facing incidents.
          - Support and Escalation: Coordinated with developers and translated technical constraints for nontechnical users during production issues.
          - Systems Foundation: Built practical instincts around service uptime, logs, configuration drift, and the human cost of unclear operational processes.

