{{ $posts := first 3 (where .Site.RegularPages.ByDate.Reverse "Section" "blogs") }}
{{ if $posts }}
<section id="writing" class="py-5">
  <div class="container">
    <h3 class="text-center">Latest Writing</h3>
    <div class="row justify-content-center pt-4">
      {{ range $posts }}
      <div class="col-lg-4 col-md-6 my-3">
        <a class="card my-3 h-100 p-3 writing-card" href="{{ .RelPermalink }}" title="{{ .Title }}">
          <div class="card-body bg-transparent">
            <h5 class="card-title bg-transparent">{{ .Title }}</h5>
            <div class="card-text secondary-font">{{ .Params.summary }}</div>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date | time.Format (":date_medium" | default "Jan 2, 2006") }}</time>
          </div>
        </a>
      </div>
      {{ end }}
    </div>
    <div class="text-center pt-3">
      <a href="{{ "blogs/" | relURL }}" class="btn">View All Writing</a>
    </div>
  </div>
</section>
{{ end }}
